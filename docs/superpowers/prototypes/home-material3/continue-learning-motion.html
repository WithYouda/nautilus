    background: transparent; color: transparent; touch-action: manipulation;

<script>
(() => {
  const root = document.getElementById('nautilus-continue-motion');
  const phone = root.querySelector('.motion-phone');
  const home = root.querySelector('.motion-home');
  const room = root.querySelector('.motion-room');
  const start = root.querySelector('.motion-continue');
  const replay = root.querySelector('[data-replay]');
  const announcement = root.querySelector('[data-announcement]');
  const durationLabel = root.querySelector('[data-duration]');
  const settings = { duration: 900, rise: 16, expansion: 10 };
  let sequence = 0;
  let animations = [];
  let phase = 'home';

  function renderSettings() {
    durationLabel.textContent = (settings.duration / 1000).toFixed(1) + ' 秒';
  }
  function restoreState(value) {
    const saved = value && value.modelContent;
    if (!saved || saved.kind !== 'nautilus-continue-motion') return;
    for (const [key, min, max] of [['duration', 500, 1800], ['rise', 6, 28], ['expansion', 4, 18]]) {
      if (typeof saved[key] === 'number' && Number.isFinite(saved[key])) settings[key] = Math.max(min, Math.min(max, saved[key]));
    }
    renderSettings();
  }
  function saveSettings() {
    if (window.openai && window.openai.setWidgetState) {
      window.openai.setWidgetState({ modelContent: { kind: 'nautilus-continue-motion', ...settings }, privateContent: null }).catch(() => {});
    }
  }
  function reset(focus = true) {
    sequence += 1;
    animations.forEach(animation => animation.cancel());
    animations = [];
    phase = 'home';
    root.dataset.phase = phase;
    home.style.removeProperty('visibility');
    home.style.removeProperty('will-change');
    home.inert = false;
    home.removeAttribute('aria-hidden');
    room.inert = true;
    room.setAttribute('aria-hidden', 'true');
    start.disabled = false;
    phone.removeAttribute('aria-busy');
    announcement.textContent = '';
    if (focus) start.focus({ preventScroll: true });
  }
  async function play() {
    reset(false);
    const run = ++sequence;
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const duration = reduced ? 160 : settings.duration;
    const scale = 1 + settings.expansion / 100;
    const lift = settings.rise;
    phase = 'moving';
    root.dataset.phase = phase;
    phone.setAttribute('aria-busy', 'true');
    home.inert = true;
    start.disabled = true;
    home.style.willChange = 'transform, opacity';
    announcement.textContent = '正在进入学习室';
    const outgoing = home.animate(reduced ? [
      { opacity: 1 }, { opacity: 0 }
    ] : [
      { transform: 'translateY(0%) scaleY(1)', opacity: 1, offset: 0, easing: 'cubic-bezier(.22, .8, .28, 1)' },
      { transform: 'translateY(-1%) scaleY(' + scale + ')', opacity: 1, offset: .32, easing: 'cubic-bezier(.4, 0, .2, 1)' },
      { transform: 'translateY(-' + lift + '%) scaleY(' + scale + ')', opacity: 0, offset: 1 }
    ], { duration, fill: 'forwards', easing: 'linear' });
    const incoming = room.animate(reduced ? [
      { opacity: 0 }, { opacity: 1 }
    ] : [
      { opacity: 0, transform: 'translateY(18px)' },
      { opacity: 1, transform: 'translateY(0px)' }
    ], { duration: reduced ? duration : duration * .28, delay: reduced ? 0 : duration * .72, fill: 'forwards', easing: 'cubic-bezier(.22, 1, .36, 1)' });
    animations = [outgoing, incoming];
    try {
      await Promise.all(animations.map(animation => animation.finished));
      if (run !== sequence) return;
      phase = 'room';
      root.dataset.phase = phase;
      home.style.visibility = 'hidden';
      home.style.removeProperty('will-change');
      home.setAttribute('aria-hidden', 'true');
      room.inert = false;
      room.removeAttribute('aria-hidden');
      phone.removeAttribute('aria-busy');
      announcement.textContent = '已进入学习室示意画面';
      room.querySelector('[data-back]').focus({ preventScroll: true });
      saveSettings();
    } catch (_) {
      // Reset and replay intentionally cancel the previous transition.
    }
  }
  start.addEventListener('click', () => { if (phase === 'home') play(); });
  replay.addEventListener('click', play);
  root.querySelectorAll('[data-back]').forEach(button => button.addEventListener('click', () => reset()));
  root.addEventListener('keydown', event => { if (event.key === 'Escape') { event.preventDefault(); reset(); } });
  restoreState(window.openai && window.openai.widgetState);
  renderSettings();
  reset(false);
  window.addEventListener('openai:set_globals', event => restoreState(event.detail && event.detail.globals && event.detail.globals.widgetState));
  if (globalThis.Tweak) {
    const tweak = new Tweak({ container: phone, onChange: () => { renderSettings(); saveSettings(); } });
    tweak.addSlider(settings, 'duration', { label: '转场时长', min: 500, max: 1800, step: 50, unit: 'ms' });
    tweak.addSlider(settings, 'expansion', { label: '向上展开幅度', min: 4, max: 18, step: 1, unit: '%' });
    tweak.addSlider(settings, 'rise', { label: '淡出时上移幅度', min: 6, max: 28, step: 1, unit: '%' });
  }
})();
</script>
