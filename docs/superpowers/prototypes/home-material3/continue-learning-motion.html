<script>
(() => {
  const root=document.getElementById('nautilus-continue-motion');
  const phone=root.querySelector('.motion-phone');
  const home=root.querySelector('.motion-home');
  const surroundings=root.querySelector('.motion-surroundings');
  const focus=root.querySelector('.motion-focus');
  const art=root.querySelector('.card-art');
  const foreground=root.querySelector('.card-foreground');
  const room=root.querySelector('.motion-room');
  const start=root.querySelector('[data-continue]');
  const announcement=root.querySelector('[data-announcement]');
  let sequence=0, animations=[], phase='home';
  const curve='cubic-bezier(.4, 0, .2, 1)';
  function fitForeground() { foreground.style.transform='scale('+(phone.clientWidth/412)+')'; foreground.style.transformOrigin='0 0'; }
  new ResizeObserver(fitForeground).observe(phone); fitForeground();
  function reset(focusButton=true) {
    sequence++; animations.forEach(a=>a.cancel()); animations=[]; phase='home'; root.dataset.phase=phase;
    home.style.visibility='visible'; home.inert=false; home.removeAttribute('aria-hidden');
    room.inert=true; room.style.pointerEvents='none'; room.setAttribute('aria-hidden','true'); start.disabled=false; phone.removeAttribute('aria-busy'); announcement.textContent='';
    if(focusButton) start.focus({preventScroll:true});
  }
  async function play() {
    const duration=800;
    reset(false); const run=++sequence; const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
    phase='moving'; root.dataset.phase=phase; home.inert=true; start.disabled=true; phone.setAttribute('aria-busy','true'); announcement.textContent='正在进入学习室';
    const animate=(element,keyframes)=>element.animate(keyframes,{duration:reduced?160:duration,fill:'forwards',easing:'linear'});
    if(reduced) {
      animations=[animate(home,[{opacity:1},{opacity:0}]),animate(room,[{opacity:0},{opacity:1}])];
    } else {
      // Move the card's center first while growth starts gently at the same time.
      // Derive its top from center and height so expansion cannot masquerade as travel.
      const trajectory=Array.from({length:61},(_,i)=>{
        const t=i/60;
        const travel=1-Math.pow(1-Math.min(t/.55,1),3);
        const growth=Math.pow(Math.min(t/.76,1),2.4);
        const height=180+735*growth, width=372+40*growth;
        const centerY=718-260.5*travel;
        const fade=Math.max(0,Math.min((t-.40)/.60,1));
        const zoom=1+.72*Math.pow(Math.min(t/.76,1),2)+.10*Math.max(0,(t-.76)/.24);
        return {offset:t,left:((412-width)/2/412*100)+'%',top:((centerY-height/2)/915*100)+'%',
          width:(width/412*100)+'%',height:(height/915*100)+'%',borderRadius:(24*(1-growth))+'px',
          opacity:1-fade*fade*(3-2*fade),zoom};
      });
      // The outgoing blur and incoming clarity share one overlapping handoff.
      const handoff=trajectory.map(({offset})=>{
        const t=Math.max(0,Math.min((offset-.40)/.60,1));
        return {offset,progress:t*t*(3-2*t)};
      });
      animations=[
        animate(surroundings,[
          {filter:'blur(0px)',opacity:1,offset:0,easing:curve},
          {filter:'blur(14px)',opacity:1,offset:.36},
          {filter:'blur(14px)',opacity:1,offset:.66},
          {filter:'blur(14px)',opacity:0,offset:.84},
          {filter:'blur(14px)',opacity:0,offset:1}
        ]),
        animate(focus,trajectory.map(({zoom,...frame})=>frame)),
        animate(art,trajectory.map(({offset,zoom})=>({offset,transform:'scale('+zoom+')'}))),
        animate(art,handoff.map(({offset,progress})=>({offset,filter:'blur('+(28*progress)+'px)'}))),
        animate(foreground,[
          {filter:'blur(0px)',opacity:1,offset:0,easing:curve},
          {filter:'blur(16px)',opacity:.35,offset:.36},
          {filter:'blur(18px)',opacity:0,offset:.46},
          {filter:'blur(18px)',opacity:0,offset:1}
        ]),
        animate(room,handoff.map(({offset,progress})=>({offset,filter:'blur('+(12*(1-progress))+'px)',opacity:progress})))
      ];
    }
    try {
      await Promise.all(animations.map(a=>a.finished)); if(run!==sequence)return;
      phase='room'; root.dataset.phase=phase; home.style.visibility='hidden'; home.setAttribute('aria-hidden','true');
      room.inert=false; room.style.pointerEvents='auto'; room.removeAttribute('aria-hidden'); phone.removeAttribute('aria-busy'); announcement.textContent='已进入学习室示意画面'; room.querySelector('[data-back]').focus({preventScroll:true});
    } catch (_) { /* Reset and replay intentionally cancel the previous animation. */ }
  }
  start.addEventListener('click',()=>{if(phase==='home')play();});
  root.querySelector('[data-replay]').addEventListener('click',play);
  root.querySelectorAll('[data-back]').forEach(b=>b.addEventListener('click',()=>reset()));
  root.addEventListener('keydown',event=>{if(event.key==='Escape'){event.preventDefault();reset();}});
  reset(false);
})();
</script>
