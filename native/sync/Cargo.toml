[package]
name = "nautilus-sync"
version = "0.1.0"
edition = "2021"

[dependencies]
nautilus-core = { path = "../core" }
iroh = { version = "=1.2.0", default-features = false, features = ["tls-ring"] }
iroh-mdns-address-lookup = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"

tempfile = "3"
